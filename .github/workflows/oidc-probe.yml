name: oidc-probe
on:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ctx
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "head_repo=$GITHUB_HEAD_REPOSITORY"
          echo "base_repo=$GITHUB_REPOSITORY"
          echo "ref=$GITHUB_REF"
      - name: OIDC
        run: |
          set +e
          code=$(curl -s -m 20 -o /tmp/tok.json -w '%{http_code}' -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "oidc_http=$code"
          if [ "$code" = "200" ]; then python3 -c "import json,base64;t=json.load(open('/tmp/tok.json'))['value'];p=t.split('.')[1];p+='='*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print('SUB='+str(c.get('sub')));print('AUD='+str(c.get('aud')))"; else head -c 400 /tmp/tok.json; echo; fi
